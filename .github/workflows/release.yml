name: Build and Release Electron App

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    # curlのエラー (schannel: CRYPT_E_REVOCATION_OFFLINE) への回避策
    - name: Debug GH_TOKEN
      shell: bash
      run: |
        curl --ssl-no-revoke -H "Authorization: token $GH_TOKEN" https://api.github.com/user
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        
    - name: Set version from tag (PowerShell)
      shell: pwsh
      run: |
        $tag = "${{ github.ref }}" -replace '^refs/tags/v', ''
        Write-Host "Setting package.json version to $tag"
        # package.jsonの読み込みと書き込み
        $json = Get-Content package.json | ConvertFrom-Json
        $json.version = $tag
        $json | ConvertTo-Json -Depth 10 | Set-Content package.json

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    # electron-builderがリリース作成とアセットアップロードを行います
    - name: Build and Publish Electron App
      env:
        # electron-builderはGH_TOKENまたはGITHUB_TOKENを参照します
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        npm run typecheck
        npm run build
        npx electron-builder --win --x64 --publish always

    # 以下の 'softprops/action-gh-release' ステップは
    # 'electron-builder --publish always' と重複するため削除しました。
    # - name: Publish GitHub Release
    #   uses: softprops/action-gh-release@v2
    #   ...

    - name: Cleanup old releases
      if: success()
      uses: Nats-ji/delete-old-releases@v1
      with:
        # electron-builderが使用するトークンと合わせます
        token: ${{ secrets.GH_TOKEN }}
        keep-count: 3
        keep-old-minor-releases: false
        remove-tags: true
